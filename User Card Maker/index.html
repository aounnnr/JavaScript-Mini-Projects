<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <form action="" id="form">
            <label for="name">Name</label>
            <div class="name">
                <input type="text" id="name">
            </div>
            <label for="email">Email</label>
            <div class="e-mail">
                <input type="email" id="email">
            </div>
            <label for="age">Age</label>
            <div class="age">
                <input type="number" id="age">
            </div>
            <label for="abt">About Yourself</label>
            <div class="abt-yourself">
                <input type="text" id="abt">
            </div>
            <input type="submit" id="btn" value="Submit">
        </form>
        <div id="user_card">
            <div class="icon">
                <img width="48" height="48" src="https://img.icons8.com/fluency/48/user-male-circle--v1.png"
                    alt="user-male-circle--v1" />
            </div>
            <div class="name-2">
                <h1 id="_name">Name Here</h1>
            </div>
            <div class="e-mail-2">
                <h3 id="_email">xyz@gmail.com</h3>
            </div>
            <div class="age-2">
                <h3 id="_age">Age</h3>
            </div>
            <div class="bio">
                <h4 id="_bio">My Bio</h4>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
